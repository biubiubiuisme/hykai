<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">华银康结构化病理报告系统概览</title>
  <desc id="desc">37种结构化报告模板，覆盖国考8个癌种，累计签发结构化报告超过41万份。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b3d6b"/><stop offset="1" stop-color="#071e3d"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f5f8d" stop-opacity=".86"/><stop offset="1" stop-color="#12375e" stop-opacity=".94"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#00152e" flood-opacity=".34"/></filter>
  </defs>
  <rect width="1600" height="900" rx="38" fill="url(#bg)"/>
  <path d="M0 710 C300 620 430 820 760 720 C1050 630 1240 720 1600 560 V900 H0Z" fill="#0d6f8b" opacity=".13"/>
  <g transform="translate(86 68)">
    <text x="0" y="40" fill="#8ddff3" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="700" letter-spacing="5">STRUCTURED PATHOLOGY REPORT</text>
    <text x="0" y="108" fill="#ffffff" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="54" font-weight="750">病理报告结构化</text>
    <text x="0" y="152" fill="#b7d3e4" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23">把诊断信息沉淀为可复用、可统计、可质控的数据资产</text>
  </g>
  <g transform="translate(86 265)" filter="url(#shadow)">
    <rect width="450" height="210" rx="24" fill="url(#card)" stroke="#3c99b8" stroke-width="2"/>
    <circle cx="74" cy="70" r="34" fill="#14b8a6" opacity=".2"/><path d="M58 70h32M74 54v32" stroke="#74f2de" stroke-width="7" stroke-linecap="round"/>
    <text x="128" y="66" fill="#b7d3e4" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22">结构化报告模板</text>
    <text x="128" y="125" fill="#ffffff" font-family="Arial,PingFang SC,sans-serif" font-size="62" font-weight="700">37</text>
    <text x="218" y="125" fill="#8ddff3" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="24">种</text>
    <text x="36" y="178" fill="#8fb5c9" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18">支持医院按实际情况适应性调整</text>
  </g>
  <g transform="translate(575 265)" filter="url(#shadow)">
    <rect width="450" height="210" rx="24" fill="url(#card)" stroke="#3c99b8" stroke-width="2"/>
    <circle cx="74" cy="70" r="34" fill="#f3b63f" opacity=".18"/><path d="M55 72l13 13 27-31" fill="none" stroke="#ffd66b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="128" y="66" fill="#b7d3e4" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22">国考癌种覆盖</text>
    <text x="128" y="125" fill="#ffffff" font-family="Arial,PingFang SC,sans-serif" font-size="62" font-weight="700">8</text>
    <text x="174" y="125" fill="#8ddff3" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="24">个</text>
    <text x="36" y="178" fill="#8fb5c9" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18">术后病理 TNM 分期率相关癌种全覆盖</text>
  </g>
  <g transform="translate(1064 265)" filter="url(#shadow)">
    <rect width="450" height="210" rx="24" fill="url(#card)" stroke="#3c99b8" stroke-width="2"/>
    <circle cx="74" cy="70" r="34" fill="#5aa8ff" opacity=".18"/><path d="M55 78l14-15 11 9 18-25" fill="none" stroke="#86c9ff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="128" y="66" fill="#b7d3e4" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22">累计签发报告</text>
    <text x="128" y="125" fill="#ffffff" font-family="Arial,PingFang SC,sans-serif" font-size="62" font-weight="700">41</text>
    <text x="196" y="125" fill="#8ddff3" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="24">万+</text>
    <text x="36" y="178" fill="#8fb5c9" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18">统计截止 2026 年 7 月 16 日</text>
  </g>
  <g transform="translate(86 535)">
    <text x="0" y="32" fill="#8ddff3" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="700">覆盖典型病种</text>
    <g font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" fill="#d7e9f2">
      <g transform="translate(0 70)"><rect width="208" height="60" rx="12" fill="#ffffff" opacity=".07"/><text x="104" y="39" text-anchor="middle">胃肠道肿瘤</text></g>
      <g transform="translate(228 70)"><rect width="208" height="60" rx="12" fill="#ffffff" opacity=".07"/><text x="104" y="39" text-anchor="middle">肺癌</text></g>
      <g transform="translate(456 70)"><rect width="208" height="60" rx="12" fill="#ffffff" opacity=".07"/><text x="104" y="39" text-anchor="middle">乳腺癌</text></g>
      <g transform="translate(684 70)"><rect width="208" height="60" rx="12" fill="#ffffff" opacity=".07"/><text x="104" y="39" text-anchor="middle">前列腺癌</text></g>
      <g transform="translate(912 70)"><rect width="208" height="60" rx="12" fill="#ffffff" opacity=".07"/><text x="104" y="39" text-anchor="middle">妇科肿瘤</text></g>
      <g transform="translate(1140 70)"><rect width="288" height="60" rx="12" fill="#ffffff" opacity=".07"/><text x="144" y="39" text-anchor="middle">肝胆胰及其他病种</text></g>
    </g>
    <line x1="0" y1="188" x2="1428" y2="188" stroke="#37627d"/>
    <text x="0" y="235" fill="#8fb5c9" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18">资料口径：HYKAI 网站资料收集填写模板（2026-10-08）及《华银康病理数智化系统（10分钟版）》</text>
  </g>
</svg>
